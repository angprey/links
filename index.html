<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ang Prey - Links</title>
    <meta name="description" content="Group links for Ang Prey">
    <meta name="theme-color" content="#6366f1">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        fadeIn: 'fadeIn 0.5s ease-in-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            animation: fadeIn 0.8s ease-in-out;
        }

        .profile-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .profile-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 24px;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .profile-image:hover {
            transform: scale(1.05);
        }

        .profile-name {
            font-size: 28px;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        @media (max-width: 640px) {
            .profile-name {
                font-size: 24px;
            }
        }

        .profile-subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
        }

        .links-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 24px;
            background: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            min-height: 56px;
            position: relative;
            overflow: hidden;
        }

        .link-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(99, 102, 241, 0.1);
            transition: left 0.3s ease;
            z-index: 1;
        }

        .link-button:hover::before {
            left: 100%;
        }

        .link-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .link-button:active {
            transform: translateY(-1px);
        }

        .link-content {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            gap: 12px;
        }

        .link-icon {
            font-size: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            flex-shrink: 0;
        }

        @media (max-width: 640px) {
            .container {
                padding: 16px;
            }

            .profile-section {
                margin-bottom: 32px;
            }

            .profile-image {
                width: 100px;
                height: 100px;
                margin-bottom: 16px;
            }

            .profile-name {
                font-size: 22px;
                margin-bottom: 6px;
            }

            .link-button {
                padding: 14px 20px;
                font-size: 15px;
                min-height: 52px;
                border-radius: 10px;
            }

            .link-icon {
                font-size: 18px;
                width: 24px;
                height: 24px;
            }

            .links-section {
                gap: 10px;
            }
        }

        @supports (padding: max(0px)) {
            body {
                padding: max(env(safe-area-inset-top, 0), 16px) max(env(safe-area-inset-right, 0), 16px) max(env(safe-area-inset-bottom, 0), 16px) max(env(safe-area-inset-left, 0), 16px);
            }
        }
    </style>
</head>
